<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentVault · Fuji 部署</title>
  </head>
  <body class="bg-surface text-on-surface font-body min-h-screen">
    <main class="max-w-2xl mx-auto px-5 py-10 space-y-6">
      <a href="/" class="text-primary text-sm">← 返回 AgentVault 演示</a>
      <div>
        <p class="text-secondary font-mono text-xs">AVALANCHE FUJI TESTNET</p>
        <h1 class="text-3xl font-bold mt-2">部署你的 AgentVault</h1>
        <p class="text-on-surface-variant mt-3">这个页面帮你部署合约并设置商户。所有签名都在你的浏览器钱包里完成；不要输入或发送私钥。</p>
      </div>
      <section class="border border-outline rounded-lg p-5 space-y-4 bg-surface-container-low">
        <div class="flex flex-wrap gap-3 items-center">
          <button id="connect" class="bg-primary text-on-primary rounded px-4 py-2 font-semibold">1. 连接钱包并切换 Fuji</button>
          <span id="wallet" class="font-mono text-xs text-on-surface-variant">尚未连接</span>
        </div>
        <p class="text-sm">钱包里需要少量测试 AVAX，用于合约存款和两笔交易手续费。<a class="text-primary underline" target="_blank" rel="noopener noreferrer" href="https://build.avax.network/console/primary-network/faucet">打开 Avalanche 官方测试币水龙头</a></p>
      </section>
      <section class="border border-outline rounded-lg p-5 space-y-4 bg-surface-container-low">
        <h2 class="text-xl font-semibold">2. 设置测试规则</h2>
        <label class="block text-sm">合约存入及总预算（测试 AVAX）
          <input id="budget" type="number" min="0.001" step="0.001" value="0.02" class="mt-1 block w-full bg-surface-container rounded border border-outline p-2 text-on-surface" />
        </label>
        <label class="block text-sm">单笔上限（测试 AVAX）
          <input id="limit" type="number" min="0.0001" step="0.0001" value="0.005" class="mt-1 block w-full bg-surface-container rounded border border-outline p-2 text-on-surface" />
        </label>
        <label class="block text-sm">测试商户钱包地址
          <input id="merchant" placeholder="0x...；留空时使用你自己的钱包地址" class="mt-1 block w-full bg-surface-container rounded border border-outline p-2 text-on-surface font-mono text-xs" />
        </label>
        <p class="text-xs text-on-surface-variant">此演示将连接的钱包同时设为所有者和 Agent。商户留空会设为同一钱包，方便单人测试。</p>
        <button id="deploy" disabled class="bg-secondary text-black rounded px-4 py-2 font-semibold disabled:opacity-40 disabled:cursor-not-allowed">3. 部署并授权商户</button>
      </section>
      <section class="border border-outline rounded-lg p-5 bg-surface-container-low space-y-2" aria-live="polite">
        <h2 class="font-semibold">进度</h2>
        <p id="status">等待连接钱包。</p>
        <div id="result" class="text-sm break-all space-y-2"></div>
      </section>
    </main>
    <script type="module" src="/src/deploy.js"></script>
  </body>
</html>
